<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>计算器</title>
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <div class="app">
    <main class="calculator">
      <section class="calc" aria-label="计算器">
        <div class="display">
          <div class="expression" data-role="expression" aria-label="表达式"></div>
          <output class="result" data-role="result" aria-live="polite"></output>
          <div class="error" data-role="error" role="alert"></div>
          <div class="notice" data-role="notice" aria-live="polite"></div>
        </div>

        <div class="keypad" data-role="keypad" role="group" aria-label="计算器键盘">
          <button type="button" class="key key--utility" data-action="clearAll" aria-label="全部清除">AC</button>
          <button type="button" class="key key--utility" data-action="deleteBack" aria-label="退格">DEL</button>
          <button type="button" class="key key--utility" data-action="paren" data-value="(" aria-label="左括号">(</button>
          <button type="button" class="key key--utility" data-action="paren" data-value=")" aria-label="右括号">)</button>

          <button type="button" class="key" data-action="digit" data-value="7">7</button>
          <button type="button" class="key" data-action="digit" data-value="8">8</button>
          <button type="button" class="key" data-action="digit" data-value="9">9</button>
          <button type="button" class="key key--operator" data-action="operator" data-value="/" aria-label="除">÷</button>

          <button type="button" class="key" data-action="digit" data-value="4">4</button>
          <button type="button" class="key" data-action="digit" data-value="5">5</button>
          <button type="button" class="key" data-action="digit" data-value="6">6</button>
          <button type="button" class="key key--operator" data-action="operator" data-value="*" aria-label="乘">×</button>

          <button type="button" class="key" data-action="digit" data-value="1">1</button>
          <button type="button" class="key" data-action="digit" data-value="2">2</button>
          <button type="button" class="key" data-action="digit" data-value="3">3</button>
          <button type="button" class="key key--operator" data-action="operator" data-value="-" aria-label="减">−</button>

          <button type="button" class="key key--accent" data-action="toggleSign" aria-label="正负号">±</button>
          <button type="button" class="key" data-action="digit" data-value="0">0</button>
          <button type="button" class="key" data-action="decimal" aria-label="小数点">.</button>
          <button type="button" class="key key--operator" data-action="operator" data-value="+" aria-label="加">+</button>

          <button type="button" class="key key--accent" data-action="percent" aria-label="百分号">%</button>
          <button type="button" class="key key--equals" data-action="evaluate" aria-label="等于">=</button>
        </div>
      </section>
    </main>

    <aside class="history" data-role="history-panel" aria-label="计算历史">
      <div class="history-head">
        <h2 class="history-title">计算历史</h2>
        <button type="button" class="history-toggle" data-role="history-toggle" aria-expanded="false" aria-controls="history-list">历史</button>
      </div>
      <p class="history-empty" data-role="history-empty">暂无历史记录</p>
      <ul class="history-list" data-role="history-list" id="history-list"></ul>
      <p class="storage-note" data-role="storage-note" hidden>历史记录仅本次会话可用（本地存储不可用）</p>
      <button type="button" class="history-clear" data-role="history-clear" disabled>清空历史</button>
    </aside>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
