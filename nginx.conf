worker_processes auto;
pid /tmp/clawteam-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    client_max_body_size 32m;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    server {
        listen 8080 default_server;
        server_name _;
        absolute_redirect off;
        location = / { return 302 /clawteam/; }
        location = /clawteam { return 308 /clawteam/$is_args$args; }
        location = /magpie { return 308 /magpie/$is_args$args; }
        location = /_proxy/subpath.js {
            alias /etc/nginx/subpath.js;
            default_type application/javascript;
        }
        location /clawteam/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '<head>' '<head><script src="/_proxy/subpath.js" data-prefix="/clawteam"></script>';
            proxy_redirect ~^(/.*)$ /clawteam$1;
        }
        location /magpie/ {
            proxy_pass http://127.0.0.1:3430/;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter '<head>' '<head><script src="/_proxy/subpath.js" data-prefix="/magpie"></script>';
            sub_filter 'action="/_magpie/' 'action="/magpie/_magpie/';
            proxy_redirect ~^(/.*)$ /magpie$1;
            proxy_cookie_path / /magpie/;
        }
        location / { return 404; }
    }
}
